<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GAIATECH GLOBAL — Infraestruturas Inteligentes, métodos, laboratórios, experimentação e validação para desafios reais.">
  <title>GAIATECH GLOBAL | Infraestruturas Inteligentes</title>

  <style>
    :root {
      --ink: #102033;
      --muted: #5e6d7d;
      --line: #dce5ec;
      --paper: #f7fafc;
      --white: #ffffff;
      --blue: #1457d9;
      --blue-dark: #0c2e67;
      --cyan: #19a7b8;
      --shadow: 0 18px 50px rgba(16, 32, 51, .10);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui,
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--white);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1160px, 92%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-weight: 900;
      letter-spacing: .08em;
      font-size: 1.1rem;
    }

    .brand span {
      display: block;
      font-size: .62rem;
      letter-spacing: .25em;
      color: var(--blue);
      margin-top: -3px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: .9rem;
      color: var(--muted);
    }

    nav a:hover {
      color: var(--blue);
    }

    .menu {
      display: none;
      border: 0;
      background: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 12px 20px;
      font-weight: 750;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--blue);
      color: white;
    }

    .btn-primary:hover {
      background: var(--blue-dark);
    }
